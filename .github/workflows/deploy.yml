name: Deploy AI Credits Report

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets into HTML
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          WORKSPACE_GID: ${{ secrets.ASANA_WORKSPACE_GID }}
        run: |
          sed -i "s|%%ASANA_TOKEN%%|${ASANA_TOKEN}|g" index.html
          sed -i "s|%%WORKSPACE_GID%%|${WORKSPACE_GID}|g" index.html

      - name: Deploy to GitHub Pages
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Copy the built file out before switching branches
          cp index.html /tmp/index.html

          # Create or reset gh-pages as an orphan branch
          git checkout --orphan gh-pages-tmp
          git rm -rf . --quiet || true
          cp /tmp/index.html index.html
          git add index.html
          git commit -m "Deploy $(date +'%Y-%m-%d %H:%M')"

          # Force-push to gh-pages (creates it if missing)
          git push origin HEAD:gh-pages --force --force-with-lease=gh-pages || git push origin HEAD:gh-pages --force
